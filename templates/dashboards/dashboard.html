{% extends 'base.html' %}

{% block content %}
 {% if user.is_authenticated %}   
<div class = 'row'>
    <!-- Left sidebar -->
<!-- load the side bar here -->
 {% include 'dashboards/sidebar.html' %}


    <!-- Right side content -->
    <div class="col-md-9">
              <span>Logged in as: <b>{{ user.username }}</b> </span>
        <div class="row">
            <div class="col">
                <div class="card border-default mb-3">
                    <div class="card-header text-center text-uppercase font-weight-bold">
                        All Categories
                        <div class="card-body text-dark" >
                            <h5 class="card-title text-center">{{category_count}}

                            </h5>
                        </div>
                    </div>
                </div>
            </div>
             <div class="col">
                <div class="card border-default mb-3">
                    <div class="card-header text-center text-uppercase font-weight-bold">
                        All Posts
                        <div class="card-body text-dark" >
                            <h5 class="card-title text-center">{{blog_count}}
                                
                            </h5>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>
{% else %}
    <p>Please log in to access the dashboard.</p>
{% endif %}

{% endblock %}
