{% extends 'base.html' %}

{% block content %}

<form action="{% url 'add_category' %}" method="POST">
    {% csrf_token %}
    <input type="text" placeholder="Category Name" name="category_name" class="form-control mb-3">

    
    <button  type="submit" class="btn btn-warning text-darker">Add Category</button>

</form>

{% endblock %}
